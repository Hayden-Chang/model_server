name: model-server

services:
  caddy:
    image: model-server-caddy:2.11.4
    build:
      context: ./caddy
    restart: unless-stopped
    depends_on:
      business-api:
        condition: service_healthy
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
    ports:
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /srv/pieceplan-themes:/srv/puzzle-themes:ro


  business-api:
    build:
      context: ./business_api
    restart: unless-stopped
    depends_on:
      - litellm
    environment:
      BUSINESS_API_KEY: ${BUSINESS_API_KEY:?BUSINESS_API_KEY is required}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      LITELLM_MODEL_ALIAS: primary-model
      STRUCTURED_OUTPUT_MODE: ${STRUCTURED_OUTPUT_MODE:-json_schema}
      TIME_FRAGMENT_TOKEN_SECRET: ${TIME_FRAGMENT_TOKEN_SECRET:?TIME_FRAGMENT_TOKEN_SECRET is required}
      TIME_FRAGMENT_TOKEN_TTL_SECONDS: ${TIME_FRAGMENT_TOKEN_TTL_SECONDS:-2592000}
      TIME_FRAGMENT_DEVELOPMENT_DEVICE_IDS: ${TIME_FRAGMENT_DEVELOPMENT_DEVICE_IDS:-}
      TIME_FRAGMENT_GUEST_QUOTA_LIMIT: ${TIME_FRAGMENT_GUEST_QUOTA_LIMIT:-30}
      USAGE_DB_PATH: /var/lib/model-server/usage.sqlite3
      USAGE_CONTENT_RETENTION_DAYS: ${USAGE_CONTENT_RETENTION_DAYS:-30}
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - model-server-usage:/var/lib/model-server
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  rent-room-api:
    build:
      context: ./business_api
    command: [uvicorn, app.rent_room_main:app, --host, 0.0.0.0, --port, "8000"]
    restart: unless-stopped
    environment:
      RENT_ROOM_APP_ID: ${RENT_ROOM_APP_ID:-wxf43c7f280c98efca}
      RENT_ROOM_APP_SECRET: ${RENT_ROOM_APP_SECRET:-}
      RENT_ROOM_OFFER_ID: ${RENT_ROOM_OFFER_ID:-1450681249}
      RENT_ROOM_APP_KEY: ${RENT_ROOM_APP_KEY:-}
      RENT_ROOM_TOKEN_SECRET: ${RENT_ROOM_TOKEN_SECRET:-}
      RENT_ROOM_PUSH_TOKEN: ${RENT_ROOM_PUSH_TOKEN:-}
      RENT_ROOM_PUSH_AES_KEY: ${RENT_ROOM_PUSH_AES_KEY:-}
      RENT_ROOM_PAYMENTS_ENABLED: ${RENT_ROOM_PAYMENTS_ENABLED:-false}
      RENT_ROOM_IOS_PAYMENTS_ENABLED: ${RENT_ROOM_IOS_PAYMENTS_ENABLED:-false}
      RENT_ROOM_FREE_CAPACITY: ${RENT_ROOM_FREE_CAPACITY:-1}
      RENT_ROOM_DB_PATH: /var/lib/rent-room/capacity.sqlite3
    expose: ["8000"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - rent-room-capacity:/var/lib/rent-room
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:v1.98.0
    restart: unless-stopped
    command:
      - --config
      - /app/config.yaml
      - --port
      - "4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
      LLM_MODEL: ${LLM_MODEL:?LLM_MODEL is required}
      LLM_API_BASE: ${LLM_API_BASE:?LLM_API_BASE is required}
      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
    expose:
      - "4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro

volumes:
  model-server-usage:
  rent-room-capacity:
