# Opt-in cutover: import the stopped legacy quota database before serving traffic.
services:
  caddy:
    depends_on:
      time-fragment-api:
        condition: service_healthy
    volumes:
      - ./Caddyfile.accounts:/etc/caddy/Caddyfile:ro
  business-api:
    environment:
      PLANNING_INTERNAL_ONLY: "true"
      PLANNING_INTERNAL_SECRET: ${PLANNING_INTERNAL_SECRET:?PLANNING_INTERNAL_SECRET is required}
  time-fragment-api:
    build:
      context: ./business_api
    command: [uvicorn, app.account_main:app, --host, 0.0.0.0, --port, "8000"]
    restart: unless-stopped
    depends_on:
      business-api:
        condition: service_healthy
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      PLANNING_BASE_URL: http://business-api:8000
      PLANNING_INTERNAL_SECRET: ${PLANNING_INTERNAL_SECRET:?PLANNING_INTERNAL_SECRET is required}
      TIME_FRAGMENT_TOKEN_SECRET: ${TIME_FRAGMENT_TOKEN_SECRET:?TIME_FRAGMENT_TOKEN_SECRET is required}
      TIME_FRAGMENT_TOKEN_TTL_SECONDS: ${TIME_FRAGMENT_TOKEN_TTL_SECONDS:-2592000}
      TIME_FRAGMENT_GUEST_QUOTA_LIMIT: ${TIME_FRAGMENT_GUEST_QUOTA_LIMIT:-30}
      TIME_FRAGMENT_MEMBER_QUOTA_LIMIT: ${TIME_FRAGMENT_MEMBER_QUOTA_LIMIT:-30}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      # This service owns POST /billing/apple/verify, which decodes the JWS and
      # calls the App Store Server API, so it needs the same Apple credentials as
      # the worker. Omitting them made every purchase fail closed with
      # BILLING_NOT_CONFIGURED (503) while StoreKit had already charged the user.
      APPLE_ENVIRONMENT: ${APPLE_ENVIRONMENT:-sandbox}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.hayden.timefragment}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      # Path form, because the key is delivered as a file on the host and
      # docker compose does not expand $(cat …) in .env. resolve_apple_key_p8
      # prefers this over the inline value. The default must stay in step with
      # the mount below: the container cannot see the host path.
      APPLE_PRIVATE_KEY_PATH: ${APPLE_PRIVATE_KEY_PATH:-/opt/model_server/.secrets/apple.p8}
      STORE_REFERENCE_KEY: ${STORE_REFERENCE_KEY:?STORE_REFERENCE_KEY is required}
    expose: ["8000"]
    read_only: true
    tmpfs: [/tmp]
    volumes:
      # SQLite is in WAL mode, so the importer and reverse exporter need a
      # writable mount even though the running API never writes to this volume.
      - model-server-usage:/var/lib/model-server
      # Read-only: Apple signing key. Without this mount APPLE_PRIVATE_KEY_PATH
      # points at a host path the container cannot see.
      - ./.secrets:/opt/model_server/.secrets:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=20)"]
      interval: 30s
      timeout: 25s
      retries: 3
  billing-worker:
    build:
      context: ./business_api
    command: [python, -m, app.billing_worker]
    restart: unless-stopped
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:?SUPABASE_PUBLISHABLE_KEY is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
      APPLE_ENVIRONMENT: ${APPLE_ENVIRONMENT:-sandbox}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.hayden.timefragment}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      # See time-fragment-api: the host ships the key as a file, and the
      # container needs the mount below to read it.
      APPLE_PRIVATE_KEY_PATH: ${APPLE_PRIVATE_KEY_PATH:-/opt/model_server/.secrets/apple.p8}
      STORE_REFERENCE_KEY: ${STORE_REFERENCE_KEY:?STORE_REFERENCE_KEY is required}
      PLANNING_INTERNAL_SECRET: ${PLANNING_INTERNAL_SECRET:?PLANNING_INTERNAL_SECRET is required}
      TIME_FRAGMENT_TOKEN_SECRET: ${TIME_FRAGMENT_TOKEN_SECRET:?TIME_FRAGMENT_TOKEN_SECRET is required}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY is required}
      BILLING_WORKER_INTERVAL_SECONDS: ${BILLING_WORKER_INTERVAL_SECONDS:-300}
    read_only: true
    tmpfs: [/tmp]
    volumes:
      # Read-only: the worker runs webhook processing and reconcile, both of
      # which sign App Store Server API requests with the same key.
      - ./.secrets:/opt/model_server/.secrets:ro

  # Opt-in one-off for the emergency rollback: writable legacy volume and only
  # the two credentials the reverse export needs. It never publishes a port.
  quota-rollback:
    build:
      context: ./business_api
    profiles: ["rollback"]
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?SUPABASE_URL is required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?SUPABASE_SERVICE_ROLE_KEY is required}
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - model-server-usage:/var/lib/model-server
